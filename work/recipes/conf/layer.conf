# SyMoNeuRaL layer. Holds every SyMoNeuRaL-authored recipe and class.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "symoneural"
BBFILE_PATTERN_symoneural = "^${LAYERDIR}/"
BBFILE_PRIORITY_symoneural = "10"
LAYERDEPENDS_symoneural = "core"
LAYERSERIES_COMPAT_symoneural = "scarthgap wrynose blacksail"

# Licence texts for BINARY_EXTERNAL components the estate consumes but does not build
# (NVIDIA CUDA toolkit under NVIDIA's EULA). Each file is named by its LicenseRef- id
# and its provenance is recorded in the recipe that uses it.
LICENSE_PATH += "${LAYERDIR}/files/custom-licenses"

# The repository root, derived from where this layer sits (work/recipes/ -> ../..).
# Every recipe and class resolves paths against it; nothing carries an absolute path.
SYMON_REPO = "${@os.path.abspath(os.path.join('${LAYERDIR}', '..', '..'))}"
